services:
  - type: web
    name: honeychain-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_PASSWORD
        value: KvicAdmin@2024
      - key: OFFICER_PASSWORD
        value: KvicOfficer@2024
      - key: LAB_PASSWORD
        value: LabInspector@2024
